<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Data Center Pulse — MENA Infrastructure Intelligence</title>
    <meta name="author" content="Data Center Pulse" />

    <!--
      Fallback meta for crawlers that do not run JavaScript (link-preview bots).
      src/components/Seo.tsx removes every [data-static-seo] tag once the app loads and
      renders the real, per-page tags. The canonical URL and JSON-LD are intentionally
      NOT set here: they are per-page and set only by Seo.tsx, so each page has exactly one.
      The site-URL placeholder in the image tags below is filled at build time (see vite.config.ts) from VITE_SITE_URL.
    -->
    <meta data-static-seo name="description" content="The leading source for MENA data center news, market intelligence, and infrastructure trends — daily briefings on M&A, AI, and sustainability for industry leaders." />
    <meta data-static-seo property="og:type" content="website" />
    <meta data-static-seo property="og:site_name" content="Data Center Pulse" />
    <meta data-static-seo property="og:title" content="Data Center Pulse — MENA Infrastructure Intelligence" />
    <meta data-static-seo property="og:description" content="Daily MENA-first data center news, market intelligence, and infrastructure trends — M&A, AI, and sustainability coverage for industry leaders." />
    <meta data-static-seo property="og:image" content="__SITE_URL__/og-default.png" />
    <meta data-static-seo name="twitter:card" content="summary_large_image" />
    <meta data-static-seo name="twitter:title" content="Data Center Pulse — MENA Infrastructure Intelligence" />
    <meta data-static-seo name="twitter:description" content="Daily MENA-first data center news, market intelligence, and infrastructure trends for industry leaders." />
    <meta data-static-seo name="twitter:image" content="__SITE_URL__/og-default.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
